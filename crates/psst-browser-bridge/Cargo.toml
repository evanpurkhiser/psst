[package]
name = "psst-browser-bridge"
version = "0.3.0"
edition = "2024"
description = "Container browser bridge for psst"
license = "MIT"
repository = "https://github.com/evanpurkhiser/psst"
publish = false

[dependencies]
libc = "0.2"
psst = { package = "psst-cli", path = "../..", default-features = false }
serde_json = "1.0"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.24"
