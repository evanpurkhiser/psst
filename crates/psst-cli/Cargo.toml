[package]
name = "psst-cli"
version = "0.4.0"
edition = "2024"
description = "Short-lived, local sessions for 1Password item-sharing links"
license = "MIT"
repository = "https://github.com/evanpurkhiser/psst"
homepage = "https://github.com/evanpurkhiser/psst"
readme = "../../README.md"
keywords = ["cli", "onepassword", "secrets", "security"]
categories = ["command-line-utilities", "authentication"]

[[bin]]
name = "psst"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
axum = { version = "0.8", features = ["json", "tokio"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
data-encoding = "2.9"
hkdf = "0.12"
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
specta = { version = "2.0.0-rc.28", features = ["derive", "serde_json"] }
specta-serde = "0.0.15"
specta-zod = { version = "0.0.6", features = ["serde"] }
thiserror = "2.0"
tokio = { version = "1.48", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
totp-rs = { version = "6.0", default-features = false, features = ["otpauth", "zeroize"] }
tower-http = { version = "0.6", features = ["cors"] }
url = "2.5"
zeroize = "1.8"
zbus = { version = "5.19", default-features = false, features = [
  "blocking-api",
  "option-as-array",
  "tokio",
] }

[dev-dependencies]
tempfile = "3.24"
