[package]
name = "psst-cli"
version = "0.1.0"
edition = "2024"
description = "Short-lived, local sessions for 1Password item-sharing links"
license = "MIT"
repository = "https://github.com/evanpurkhiser/psst"
homepage = "https://github.com/evanpurkhiser/psst"
readme = "README.md"
keywords = ["cli", "onepassword", "secrets", "security"]
categories = ["command-line-utilities", "authentication"]

[[bin]]
name = "psst"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
data-encoding = "2.9"
hkdf = "0.12"
hmac = "0.12"
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "0.10"
systemd-zbus = "5.3.2"
thiserror = "2.0"
url = "2.5"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.24"
