[workspace]
members = ["crates/psst-browser-bridge"]
resolver = "3"

[package]
name = "psst-cli"
version = "0.1.2"
edition = "2024"
description = "Short-lived, local sessions for 1Password item-sharing links"
license = "MIT"
repository = "https://github.com/evanpurkhiser/psst"
homepage = "https://github.com/evanpurkhiser/psst"
readme = "README.md"
keywords = ["cli", "onepassword", "secrets", "security"]
categories = ["command-line-utilities", "authentication"]

[lib]
name = "psst"
path = "src/lib.rs"

[[bin]]
name = "psst"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = [
  "dep:aes-gcm",
  "dep:base64",
  "dep:clap",
  "dep:data-encoding",
  "dep:hkdf",
  "dep:libc",
  "dep:p256",
  "dep:rand",
  "dep:reqwest",
  "dep:serde_json",
  "dep:sha2",
  "dep:systemd-zbus",
  "dep:thiserror",
  "dep:totp-rs",
  "dep:url",
  "dep:zeroize",
]

[dependencies]
aes-gcm = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
data-encoding = { version = "2.9", optional = true }
hkdf = { version = "0.12", optional = true }
libc = { version = "0.2", optional = true }
p256 = { version = "0.13", features = ["ecdsa"], optional = true }
rand = { version = "0.9", optional = true }
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls",
], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.10", optional = true }
systemd-zbus = { version = "5.3.2", optional = true }
thiserror = { version = "2.0", optional = true }
totp-rs = { version = "6.0", default-features = false, features = ["otpauth", "zeroize"], optional = true }
url = { version = "2.5", optional = true }
zeroize = { version = "1.8", optional = true }

[dev-dependencies]
tempfile = "3.24"
