name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate_version:
    name: Validate package version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@v4.2.0
        with:
          cache: false

      - name: Match package version to tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          MISMATCHES=$(cargo metadata --format-version=1 --no-deps | jq --arg version "$VERSION" -r '.packages[] | select(.source == null and .version != $version) | "\(.name) \(.version)"')
          if [[ -n "$MISMATCHES" ]]; then
            echo "Tag ${TAG} does not match workspace packages:"
            echo "$MISMATCHES"
            exit 1
          fi
          if [[ $(jq -r '.version' browser-extension/manifest.json) != "$VERSION" ]]; then
            echo "Tag ${TAG} does not match the Chrome extension"
            exit 1
          fi

  publish_crate:
    name: Publish crate to crates.io
    runs-on: ubuntu-latest
    needs: validate_version
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@v4.2.0
        with:
          cache: false

      - name: Authenticate with crates.io (trusted publishing)
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1.0.5

      - name: Publish to crates.io
        run: cargo publish --locked --no-verify --package psst-cli --token "${STEPS_CRATES_IO_AUTH_OUTPUTS_TOKEN}"
        env:
          STEPS_CRATES_IO_AUTH_OUTPUTS_TOKEN: ${{ steps.crates_io_auth.outputs.token }}

  publish_extension:
    name: Publish Chrome extension
    runs-on: ubuntu-latest
    needs: validate_version
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@v4.2.0
        with:
          cache: false

      - name: Install Chrome
        run: |
          curl --fail --location --output /tmp/google-chrome-stable.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install --yes /tmp/google-chrome-stable.deb

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed extension
        env:
          EXTENSION_KEY: ${{ secrets.PSST_CHROME_EXTENSION_KEY }}
        run: |
          umask 077
          KEY=$(mktemp)
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$EXTENSION_KEY" > "$KEY"
          PSST_CHROME_EXTENSION_KEY_FILE="$KEY" pnpm build-release
          sha256sum target/psst-chrome-extension.crx > target/psst-chrome-extension.crx.sha256

      - name: Publish release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" --clobber \
            target/psst-chrome-extension.crx \
            target/psst-chrome-extension.crx.sha256

  publish_package:
    name: Publish package
    needs: [publish_crate, publish_extension]
    uses: evanpurkhiser/workflows/.github/workflows/bump-aur.yml@main # zizmor: ignore[unpinned-uses]
    with:
      package: psst
      version: ${{ github.ref_name }}
    secrets:
      token: ${{ secrets.AUR_BUMP_DISPATCH_PAT }}
