name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate_version:
    name: Validate package version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Match package version to tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$TAG" != "v${VERSION}" ]]; then
            echo "Tag ${TAG} does not match package version ${VERSION}"
            exit 1
          fi

  publish_crate:
    name: Publish crate to crates.io
    runs-on: ubuntu-latest
    needs: validate_version
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Authenticate with crates.io (trusted publishing)
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        run: cargo publish --locked --no-verify --token "${STEPS_CRATES_IO_AUTH_OUTPUTS_TOKEN}"
        env:
          STEPS_CRATES_IO_AUTH_OUTPUTS_TOKEN: ${{ steps.crates_io_auth.outputs.token }}

  publish_package:
    name: Publish package
    needs: validate_version
    uses: evanpurkhiser/workflows/.github/workflows/bump-aur.yml@main # zizmor: ignore[unpinned-uses]
    with:
      package: psst
      version: ${{ github.ref_name }}
    secrets:
      token: ${{ secrets.AUR_BUMP_DISPATCH_PAT }}
